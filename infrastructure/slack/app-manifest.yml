# Slack app manifest for OpsMind. Create the app at https://api.slack.com/apps → "Create New App" →
# "From an app manifest" → paste this file. Socket Mode means NO public URL is needed.
display_information:
  name: OpsMind
  description: Human-in-the-loop SRE copilot
  background_color: "#1c2330"
features:
  bot_user:
    display_name: OpsMind
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
