# Prometheus: scrapes product-api every 5 s and evaluates alert rules.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: product-api
    static_configs:
      - targets: ["product-api:8000"]
        labels:
          service: product-api
