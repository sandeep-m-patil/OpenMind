# OpsMind local "production" environment.
# Phase 1: the application OpsMind will watch (product-api) + its Redis cache + PostgreSQL.
name: opsmind

services:
  redis:
    image: redis:7.4-alpine
    # A deliberately small cache (32 MB) so cache pressure is easy to reproduce.
    # volatile-lru: when full, Redis may only evict keys that HAVE a TTL (product-api's cache
    # entries). Keys without a TTL (e.g. buggy immortal sessions) can never be evicted — that
    # is exactly how the cache-saturation incident happens. Persistence is off: it's a cache.
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  product-api:
    build: ./product-api
    environment:
      SERVICE_NAME: product-api
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${PRODUCT_API_PORT:-8001}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
