# Serves the built dashboard and proxies API calls to the OpsMind backend (same origin → no CORS).
server {
    listen 80;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://opsmind-backend:8000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://opsmind-backend:8000;
    }

    # Client-side routing: unknown paths serve the SPA.
    location / {
        try_files $uri /index.html;
    }
}
